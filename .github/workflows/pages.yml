name: Deploy browser game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build browser game (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        backend: [webgl, webgpu]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Build WebGL2 client
        if: matrix.backend == 'webgl'
        working-directory: apps/client
        run: trunk build --release --dist dist-webgl --public-url "./"

      - name: Build WebGPU client
        if: matrix.backend == 'webgpu'
        working-directory: apps/client
        run: >-
          trunk build
          --release
          --features webgpu
          --dist dist-webgpu
          --public-url "./"

      - name: Upload ${{ matrix.backend }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.backend }}
          path: apps/client/dist-${{ matrix.backend }}

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download WebGL2 artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl
          path: dist/webgl

      - name: Download WebGPU artifact
        uses: actions/download-artifact@v4
        with:
          name: webgpu
          path: dist/webgpu

      - name: Add renderer selector
        run: cp apps/client/backend-selector.html dist/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
