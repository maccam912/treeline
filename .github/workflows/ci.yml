name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux development libraries
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev libwayland-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  browser:
    name: Browser client lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The browser terrain queue and its Web Worker binary are behind
      # `cfg(target_arch = "wasm32")`, so the native lint job never compiles
      # them. Without this job a break in browser-only code first appears when
      # Pages deploys from main.
      - name: Lint WebGPU browser client
        run: >-
          cargo clippy
          -p client
          --target wasm32-unknown-unknown
          --all-targets
          --features webgpu
          -- -D warnings

  determinism:
    name: Cross-platform generator fingerprints
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test generator fingerprints
        run: >-
          cargo test
          -p treeline-coordinates
          -p treeline-terrain
          -p treeline-climate
          -p treeline-ecology
          -p treeline-mesher
          --lib
