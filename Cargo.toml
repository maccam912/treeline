[workspace]
members = [
    "apps/client",
    "apps/generator-lab",
    "apps/server",
    "crates/climate",
    "crates/coordinates",
    "crates/ecology",
    "crates/mesher",
    "crates/platform",
    "crates/protocol",
    "crates/renderer",
    "crates/terrain",
    "crates/voxel",
    "crates/world",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["Treeline Contributors"]

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "3d",
    "ui",
    "bluenoise_texture",
] }
console_error_panic_hook = "0.1"
glam = { version = "0.30.5", features = ["libm"] }
libm = { version = "0.2.16", default-features = false }
js-sys = "0.3"
mcubes = "0.1.7"
transvoxel = "2.0.0"
treeline-climate = { path = "crates/climate" }
treeline-coordinates = { path = "crates/coordinates" }
treeline-ecology = { path = "crates/ecology" }
treeline-mesher = { path = "crates/mesher" }
treeline-platform = { path = "crates/platform" }
treeline-protocol = { path = "crates/protocol" }
treeline-renderer = { path = "crates/renderer" }
treeline-terrain = { path = "crates/terrain" }
treeline-voxel = { path = "crates/voxel" }
treeline-world = { path = "crates/world" }
wasm-bindgen = "0.2"
web-time = "1.1"
web-sys = "0.3"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
