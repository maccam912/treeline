[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["Treeline Contributors"]

[workspace.dependencies]
bytemuck = { version = "1.23.2", features = ["derive"] }
console_error_panic_hook = "0.1"
egui = "0.31.1"
egui-wgpu = "0.31.1"
egui-winit = { version = "0.31.1", default-features = false }
glam = { version = "0.30.5", features = ["libm"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libm = { version = "0.2.16", default-features = false }
js-sys = "0.3"
mcubes = "0.1.7"
pollster = "0.4.0"
serde_json = "1.0"
transvoxel = "2.0.0"
treeline-caves = { path = "crates/caves" }
treeline-coordinates = { path = "crates/coordinates" }
treeline-ecology = { path = "crates/ecology" }
treeline-geography = { path = "crates/geography" }
treeline-hydrology = { path = "crates/hydrology" }
treeline-mesher = { path = "crates/mesher" }
treeline-platform = { path = "crates/platform" }
treeline-protocol = { path = "crates/protocol" }
treeline-renderer = { path = "crates/renderer" }
treeline-simulation = { path = "crates/simulation" }
treeline-terrain = { path = "crates/terrain" }
treeline-voxel = { path = "crates/voxel" }
treeline-world = { path = "crates/world" }
wgpu = "24.0.5"
winit = "0.30.12"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-time = "1.1"
web-sys = "0.3"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
