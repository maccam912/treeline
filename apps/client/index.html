<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Explore Treeline's deterministic wilderness terrain in your browser."
    />
    <base data-trunk-public-url />
    <title>Treeline — Infinite Landscape</title>
    <link data-trunk rel="rust" data-bin="client" />
    <link
      data-trunk
      rel="rust"
      data-bin="terrain-worker"
      data-type="worker"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #09110d;
        color: #f2f0df;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      canvas {
        position: fixed;
        left: var(--viewport-left, 0px);
        top: var(--viewport-top, 0px);
        display: block;
        width: var(--viewport-width, 100dvw) !important;
        height: var(--viewport-height, 100dvh) !important;
        touch-action: none;
      }

      .desktop-controls {
        position: fixed;
        z-index: 1;
        left: max(1rem, env(safe-area-inset-left));
        bottom: max(1rem, env(safe-area-inset-bottom));
        padding: 0.65rem 0.8rem;
        border: 1px solid rgb(242 240 223 / 18%);
        border-radius: 0.4rem;
        background: rgb(9 17 13 / 72%);
        font-size: 0.78rem;
        letter-spacing: 0.025em;
        pointer-events: none;
        backdrop-filter: blur(0.4rem);
      }

      .mobile-controls {
        position: fixed;
        z-index: 2;
        left: var(--viewport-left, 0px);
        top: var(--viewport-top, 0px);
        display: none;
        width: var(--viewport-width, 100dvw);
        height: var(--viewport-height, 100dvh);
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .mobile .desktop-controls {
        display: none;
      }

      .mobile .mobile-controls {
        display: block;
      }

      .stick {
        position: absolute;
        bottom: max(1.35rem, env(safe-area-inset-bottom));
        width: 7.25rem;
        height: 7.25rem;
        border: 1px solid rgb(242 240 223 / 28%);
        border-radius: 50%;
        background: rgb(9 17 13 / 35%);
        box-shadow: inset 0 0 1.5rem rgb(0 0 0 / 22%);
        opacity: 0.72;
        backdrop-filter: blur(0.25rem);
      }

      .stick::before {
        position: absolute;
        inset: 50% auto auto 50%;
        width: 3.25rem;
        height: 3.25rem;
        border: 1px solid rgb(242 240 223 / 38%);
        border-radius: 50%;
        background: rgb(242 240 223 / 18%);
        content: "";
        transform: translate(-50%, -50%) translate(var(--stick-x, 0px), var(--stick-y, 0px));
      }

      .stick::after {
        position: absolute;
        top: -1.45rem;
        left: 50%;
        color: rgb(242 240 223 / 72%);
        content: attr(data-label);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transform: translateX(-50%);
      }

      .move-stick {
        left: max(1.35rem, env(safe-area-inset-left));
      }

      .look-stick {
        right: max(1.35rem, env(safe-area-inset-right));
      }

      .warp-button {
        position: absolute;
        top: max(1rem, env(safe-area-inset-top));
        right: max(1rem, env(safe-area-inset-right));
        padding: 0.7rem 0.9rem;
        border: 1px solid rgb(242 240 223 / 32%);
        border-radius: 999px;
        background: rgb(9 17 13 / 78%);
        color: #f2f0df;
        font: inherit;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        pointer-events: auto;
        touch-action: manipulation;
        text-transform: uppercase;
        backdrop-filter: blur(0.4rem);
      }

      .warp-button:active {
        background: rgb(72 101 76 / 88%);
      }

      @media (max-height: 500px) {
        .stick {
          width: 6rem;
          height: 6rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="desktop-controls">
      Click to look · WASD to walk · Shift to sprint · R to random warp · Esc to release
    </div>
    <div class="mobile-controls">
      <button class="warp-button" type="button" aria-label="Warp to a random distant location">
        Random warp
      </button>
      <div class="stick move-stick" data-label="Move"></div>
      <div class="stick look-stick" data-label="Look"></div>
    </div>
    <noscript>Treeline requires JavaScript and WebAssembly.</noscript>
    <script>
      (() => {
        const root = document.documentElement;
        const coarsePointer = window.matchMedia("(pointer: coarse)");
        const mobileUserAgent =
          navigator.userAgentData?.mobile ??
          /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        const sticks = {
          move: document.querySelector(".move-stick"),
          look: document.querySelector(".look-stick"),
        };
        const warpButton = document.querySelector(".warp-button");
        const activeTouches = new Map();
        const stickRadius = 46;

        const updateMobileMode = () => {
          root.classList.toggle("mobile", mobileUserAgent || coarsePointer.matches);
        };

        const updateViewport = () => {
          const viewport = window.visualViewport;
          root.style.setProperty("--viewport-left", `${viewport?.offsetLeft ?? 0}px`);
          root.style.setProperty("--viewport-top", `${viewport?.offsetTop ?? 0}px`);
          root.style.setProperty("--viewport-width", `${viewport?.width ?? window.innerWidth}px`);
          root.style.setProperty("--viewport-height", `${viewport?.height ?? window.innerHeight}px`);
        };

        const updateStick = (kind, deltaX, deltaY) => {
          const length = Math.hypot(deltaX, deltaY);
          const scale = length > stickRadius ? stickRadius / length : 1;
          sticks[kind].style.setProperty("--stick-x", `${deltaX * scale}px`);
          sticks[kind].style.setProperty("--stick-y", `${deltaY * scale}px`);
        };

        window.addEventListener(
          "touchstart",
          (event) => {
            for (const touch of event.changedTouches) {
              const kind = touch.clientX < window.innerWidth / 2 ? "move" : "look";
              if ([...activeTouches.values()].some((active) => active.kind === kind)) continue;
              activeTouches.set(touch.identifier, {
                kind,
                x: touch.clientX,
                y: touch.clientY,
              });
            }
          },
          { passive: true },
        );
        window.addEventListener(
          "touchmove",
          (event) => {
            for (const touch of event.changedTouches) {
              const active = activeTouches.get(touch.identifier);
              if (active) {
                updateStick(active.kind, touch.clientX - active.x, touch.clientY - active.y);
              }
            }
          },
          { passive: true },
        );
        const releaseTouches = (event) => {
          for (const touch of event.changedTouches) {
            const active = activeTouches.get(touch.identifier);
            if (active) {
              updateStick(active.kind, 0, 0);
              activeTouches.delete(touch.identifier);
            }
          }
        };
        window.addEventListener("touchend", releaseTouches, { passive: true });
        window.addEventListener("touchcancel", releaseTouches, { passive: true });
        for (const eventName of ["touchstart", "touchmove", "touchend", "touchcancel"]) {
          warpButton.addEventListener(
            eventName,
            (event) => event.stopPropagation(),
            { passive: true },
          );
        }
        warpButton.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          window.dispatchEvent(new Event("treeline-random-warp"));
          warpButton.blur();
        });

        updateMobileMode();
        updateViewport();
        coarsePointer.addEventListener?.("change", updateMobileMode);
        window.addEventListener("resize", updateViewport);
        window.visualViewport?.addEventListener("resize", updateViewport);
        window.visualViewport?.addEventListener("scroll", updateViewport);
      })();
    </script>
  </body>
</html>
